name: jarvis_mobile
description: A cross-platform mobile voice assistant built with Flutter. Features voice input/output, OpenAI integration, and smart device control.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Voice Recognition
  speech_to_text: ^6.4.0
  
  # Text-to-Speech
  flutter_tts: ^0.14.0
  
  # OpenAI API
  openai_flutter: ^0.1.0
  http: ^1.1.0
  
  # State Management
  provider: ^6.0.0
  
  # Smart Device Control
  mqtt_client: ^10.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  
  # UI/UX
  google_fonts: ^6.0.0
  lottie: ^2.6.0
  
  # Networking
  dio: ^5.3.0
  connectivity_plus: ^5.0.0
  
  # Logging
  logger: ^2.0.0
  
  # Environment Variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
    - .env

  fonts:
    - family: GoogleFonts
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
